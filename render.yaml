services:
  - type: web
    name: scholardesk-sis
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_students"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
